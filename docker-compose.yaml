version: '3.8'

services:
  MongoDB:
    image: docker.io/library/mongo:7.0
    container_name: Operation_Black_Ledger_mongo
    restart: always
    ports:
      - '27017:27017'

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: ''

    volumes:
      - mongo_data:/data/db


  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_kraft:/var/lib/kafka/data


  redis:
    image: redis:latest
    container_name: redis_orders
    ports:
      - '6441:6379'

    volumes:
      - redis_data:/data


  redis_ui:
    image: redis/redisinsight:latest
    container_name: redis_orders_ui
    ports:
      - '5540:5540'
    depends_on:
      - redis


  api:
    build:
      context: /api
      dockerfile: Dockerfile

    environment:
      KAFKA_URI: 'kafka:9092'
      KAFKA_TOPIC: 'pizza-orders'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6441'
      REDIS_QUEUE_NAME: ''
      MONGODB_COLLECTION: ''
      MONGODB_DATABASE: ''
      MONGO_URI: 'mongodb://root:password@mongodb:27017/?authSource=admin'

    ports:
      - '8080:8080'


  worker_kitchen:
#    consumer_config = {
#    "bootstrap.servers": "kafka:9092",
#    "group.id": "order-tracker",
#    "auto.offset.reset": "earliest"
#}


  worker_text:
#  consumer_config = {
#  "bootstrap.servers": "kafka:9092",
#  "group.id": "order-tracker",
#  "auto.offset.reset": "earliest"
#}


volumes:
  kafka_kraft:
  redis_data:
  mongo_data: